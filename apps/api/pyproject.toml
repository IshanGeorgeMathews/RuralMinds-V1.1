[project]
name = "ruralminds-api"
version = "0.1.0"
description = "Offline-first RuralMinds school learning API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
  "pypdfium2>=5.14.0",
  "sqlite-vec>=0.1.9",
  "sympy>=1.14,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruralminds"]

