[project]
name = "ruralminds-worker"
version = "0.1.0"
description = "RuralMinds background worker package"
requires-python = ">=3.12,<3.13"
dependencies = ["ruralminds-api"]

[tool.uv.sources]
ruralminds-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruralminds_worker"]
